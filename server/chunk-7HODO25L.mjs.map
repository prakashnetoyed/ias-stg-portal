<div class="demo-shell">
  <form id="airpay-demo-form" method="post" [action]="formAction">
    <input *ngFor="let field of formFields" type="hidden" [name]="field.name" [value]="field.value" />
  </form>

  <div class="demo-card">
    <div class="spinner"></div>
    <h1>Redirecting to Airpay</h1>
    <p *ngIf="!errorMessage">Please wait while we forward you to the payment page.</p>
    <p *ngIf="errorMessage" class="error-text">{{ errorMessage }}</p>

    <div class="actions">
      <button type="button" class="primary" (click)="submitForm()">Continue to Airpay</button>
      <button type="button" class="secondary" onclick="window.location.reload()">Retry</button>
    </div>

    <div class="hint">
      Rediecting to Payment Gateway.
    </div>
  </div>
</div>
