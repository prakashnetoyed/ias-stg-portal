<div class="main-allmembers-section" (window:scroll)="onScroll()">
    <div class="main-gradient">
        <div class="container">
            <div class="heading-div">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb d-flex align-items-center">
                        <li class="breadcrumb-item m-0"><a href="/homepage">Home</a></li>
                        <li class="breadcrumb-item active m-0" aria-current="page">Members</li>
                    </ol>
                </nav>
                <h1>Members’ Directory</h1>
                <p>Celebrating the People Behind the Profession — Sharing Moments, Interests, and Stories that Connect
                    Us.</p>
            </div>
        </div>
    </div>

    <div class="all-members-cards">
        <div class="container">
            <ng-container *ngFor="let member of cadres">
                <div class="membercards" *ngIf="member.doptOfficer?.profilePic">
                    <img [src]="member.doptOfficer.profilePic" [alt]="member.doptOfficer.englishName" draggable="false">
                    <h4>{{member.designation}}</h4>
                    <h1 class="mt-2">{{ member.doptOfficer.englishName }}</h1>
                </div>
            </ng-container>
        </div>
    </div>
</div>
