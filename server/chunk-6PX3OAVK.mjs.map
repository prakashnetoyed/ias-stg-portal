<!-- Offcanvas Form -->
<div class="offcanvas offcanvas-end" tabindex="-1" #galleryOffcanvas aria-labelledby="galleryOffcanvasLabel">
    <div class="offcanvas-header">
        <h5 id="galleryOffcanvasLabel">Upload Gallery Images</h5>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body">
        <div class="d-flex flex-wrap gap-2 mb-3">
            <div *ngFor="let img of selectedImages; let i = index" class="position-relative">
                <img [src]="img" width="100" height="80" class="rounded border" />
                <button type="button" class="btn-close position-absolute top-0 end-0" (click)="removeImage(i)"></button>
            </div>
        </div>

        <div class="upload-box border rounded p-3 text-center mb-4" (click)="fileInput.click()" style="cursor: pointer;">
            <label class="form-label d-block">
                <input #fileInput type="file" multiple (change)="onFileSelected($event)" hidden     accept=".jpg,.jpeg,.png"/>
                <span class="" >
                    Click here to upload your image
                </span>
            </label>
            <small class="text-muted">Supported format: .jpg, .png. Max size: 5 MB</small>
        </div>

        <div class="d-flex justify-content-end">
            <button type="button" class="btn btn-outline-secondary me-2" data-bs-dismiss="offcanvas">Back</button>
            <button type="button" class="btn btn-primary" (click)="onSubmit()">Submit</button>
        </div>
    </div>
</div>



<div class="tableheading">
    <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
        <h5 class="">Gallery</h5>
        <div class="filter-options d-flex align-items-center gap-2 flex-wrap flex-sm-nowrap w-md-75">
            <button class="btn btn-prime text-nowrap" (click)="openOffcanvas()">Add Image</button>
            <button class="btn btn-danger text-nowrap" (click)="toggleDeleteMode()">
                {{ deleteMode ? 'Cancel' : 'Delete Image' }}
            </button>
        </div>
    </div>

    <div class="uploaded-photos-div ">
        <h1>Uploaded Photos</h1>

        <div class="images-grid mt-4">
            <div *ngFor="let item of galleryImages" class="image-wrapper position-relative">
                <img [src]="item.image" alt="Gallery" class="rounded-2 w-100">
                <button *ngIf="deleteMode" type="button" class="delete-btn btn-close position-absolute"
                    (click)="deleteImage(item.id)">
                </button>
            </div>
        </div>
    </div>
</div>
