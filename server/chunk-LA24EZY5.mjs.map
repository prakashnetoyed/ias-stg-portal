<div class="container-fluid">
  <div class="row g-4">

    <!-- LEFT -->
    <div class="col-md-8">
      <div class="doc-viewer position-relative">

        <iframe *ngIf="fileType === 'pdf'" [src]="safeUrl" width="100%" height="700px"   (load)="onDocumentLoad()">

          sandbox="allow-same-origin allow-scripts">
        </iframe>

        <iframe *ngIf="fileType === 'other'" [src]="safeUrl" width="100%" height="700px" class="pointe"
          (load)="onDocumentLoad()">
  sandbox="allow-same-origin allow-scripts">
        </iframe>

      </div>
    </div>

    <div class="col-md-4">
      <div *ngIf="!hasFeedback || isEditMode">

        <div class="feedback-card">

          <h5 class="title">Submit Your Feedback</h5>

          <div class="section">
            <label>YOUR STANCE ON THE OVERALL NOTE</label>

            <div class="stance-group">
              <button [class.active]="stance === 'support'" (click)="setStance('support')">Support</button>
              <button [class.active]="stance === 'oppose'" (click)="setStance('oppose')">Oppose</button>
              <button [class.active]="stance === 'abstain'" (click)="setStance('abstain')">Abstain</button>
            </div>
          </div>

          <div class="section">
            <label>OVERALL REMARKS</label>
            <textarea [(ngModel)]="overallRemarks"></textarea>
          </div>

          <div class="section">
            <label>PART-SPECIFIC REMARKS</label>
            <textarea [(ngModel)]="partSpecificRemarks"></textarea>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" [(ngModel)]="isEcOnly">
            <label>Mark as EC only</label>
          </div>

          <button class="submit-btn" (click)="submitFeedback()">
            Submit feedback
          </button>

        </div>
      </div>
      <div *ngIf="hasFeedback && !isEditMode">
        <div class="feedback-card">
                    <h5 class="title">Your Feedback</h5>

        <p><strong>Stance:</strong> {{ stance }}</p>

        <p><strong>Overall Remarks:</strong></p>
        <p>{{ overallRemarks }}</p>

        <p><strong>Part Remarks:</strong></p>
        <p>{{ partSpecificRemarks }}</p>

        <p><strong>EC Only:</strong> {{ isEcOnly ? 'Yes' : 'No' }}</p>

        <button class="submit-btn mt-3" (click)="enableEdit()">
          Edit Feedback
        </button>
        </div>

      </div>
    </div>

  </div>
</div>
