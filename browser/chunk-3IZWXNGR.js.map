<div class="offcanvas offcanvas-end" tabindex="-1" id="aboutusDrawer" aria-labelledby="aboutusDrawerLabel">
    <div class="offcanvas-header">
        <h5 id="aboutusDrawerLabel">Edit About</h5>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body">
        <form [formGroup]="aboutForm" (ngSubmit)="onSubmit()" class="d-flex flex-column justify-content-between h-100">
            <div class="inner-fields">

                <div class="mb-3">
                    <label class="form-label">Title <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" formControlName="stateAssociationTitle">
                </div>

                <div class="mb-3">
                    <label class="form-label">About Description <span class="text-danger">*</span></label>
                    <textarea class="form-control" rows="3" formControlName="aboutDescription"></textarea>
                </div>

                <div class="upload-wrapper mb-3">
                    <label class="form-label">Upload Banner <span class="text-danger">*</span></label>
                    <input type="file" (change)="onImageSelected($event, 'aboutBanner')" accept="image/*"
                        class="form-control" />
                    <div class="file-box mt-3" *ngIf="selectedImages['aboutBanner']">
                        <span>Preview (Banner)</span>
                        <img [src]="selectedImages['aboutBanner']" alt="Banner Preview" class="rounded mt-2"
                            style="width: 150px;">
                    </div>
                </div>

                <div class="upload-wrapper">
                    <label class="form-label">Upload Image <span class="text-danger">*</span></label>
                    <input type="file" (change)="onImageSelected($event, 'bannerPic')" accept="image/*"
                        class="form-control" />
                    <div class="file-box mt-3" *ngIf="selectedImages['bannerPic']">
                        <span>Preview (Image)</span>
                        <img [src]="selectedImages['bannerPic']" alt="Image Preview" class="rounded mt-2"
                            style="width: 150px;">
                    </div>
                </div>

            </div>

            <div class="d-flex justify-content-end gap-3 mt-3">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="offcanvas">Back</button>
                <button type="submit" class="btn btn-prime">Submit</button>
            </div>
        </form>
    </div>
</div>




<div class="main-aboutsection">

    <!-- *ngIf="aboutData" -->

    <div class="main-heading-div">
        <h1 class="m-0">About IAS Association {{aboutData.name}}</h1>
        <button class="btn btn-prime" data-bs-toggle="offcanvas" data-bs-target="#aboutusDrawer">Edit About</button>
    </div>

    <div class="about-content-div mt-5">
        <h1>Hero banner image</h1>
        <div class="hero-banner-div">
            <img [src]="getImageUrl(aboutData.aboutBanner)" alt="about-image" class="rounded-3 w-100">
        </div>
    </div>

    <div class="about-content-div mt-5">
        <h1>About Indian Administrative Service Association, {{aboutData.name}}</h1>
        <div class="cont-div d-flex align-content-start gap-5 mt-4">
            <div class="image-div">
                <img [src]="getImageUrl(aboutData.bannerPic)" alt="about-image" class="rounded-3">
            </div>
            <div class="title-desc-div w-50">
                <div class="title-div">
                    <h3>Title: </h3>
                    <p>{{aboutData.stateAssociationTitle}}</p>
                </div>
                <div class="desc-div">
                    <h3>Content: </h3>
                    <p>{{aboutData.aboutDescription}}</p>
                </div>
            </div>
        </div>
    </div>
</div>
